name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit, tag, or Docker image version.
      placeholder: e.g. 0.1.0 / latest / commit abc123
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Monies?
      options:
        - Docker Compose
        - Portainer stack
        - Local development (npm run dev)
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, logs, screenshots, anything else that helps.
