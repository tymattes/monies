version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom are pinned exactly and must move together.
      react:
        patterns:
          - react
          - react-dom
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint caps typescript at <6.1 and the ESLint plugins behind
      # eslint-config-next cap eslint at ^9. Take these majors by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Tracks the Node major in the Dockerfile and ci.yml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
